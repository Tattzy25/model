name = "model"
main = "src/index.js"
compatibility_date = "2026-05-24"

[[r2_buckets]]
binding = "MODEL_BUCKET"
bucket_name = "model"
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
